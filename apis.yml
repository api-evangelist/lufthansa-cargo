- aid: lufthansa-cargo:lufthansa-cargo-shipment-tracking-api
  name: Lufthansa Cargo Shipment Tracking API
  description: >-
    Retrieves the current status of an air freight shipment by IATA Air Waybill, keyed on a 3-digit AWB
    prefix (020 = Lufthansa Cargo) plus an 8-digit AWB number. Returns the milestone plan, booking, flight
    movement details, e-freight details and the shipment status event history. OpenAPI 3.0.0, version
    "1.0 - 2022.01.03", secured with an apikey header.
  humanURL: https://developer.lufthansa-cargo.com/apis/shipmenttrackingpublic
  baseURL: https://api.lufthansa-cargo.com
