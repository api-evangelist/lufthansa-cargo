apis:
  - aid: lufthansa-cargo:lufthansa-cargo-shipment-tracking-api
    name: Lufthansa Cargo Shipment Tracking API
    description: >-
      Retrieves the current status of an air freight shipment by IATA Air Waybill,
      keyed on a 3-digit AWB prefix (020 = Lufthansa Cargo) plus an 8-digit AWB
      number. Returns the milestone plan, booking, flight movement details,
      e-freight details and the shipment status event history. OpenAPI 3.0.0,
      version "1.0 - 2022.01.03", secured with an apikey header.
    humanURL: https://developer.lufthansa-cargo.com/apis/shipmenttrackingpublic
    baseURL: https://api.lufthansa-cargo.com
    tags:
      - Track and Trace
      - Air Cargo
      - Shipment Status
      - Air Waybill
    properties:
      - type: OpenAPI
        url: openapi/lufthansa-cargo-shipment-tracking-api-openapi.yml
      - type: Documentation
        url: https://developer.lufthansa-cargo.com/apis/shipmenttrackingpublic
      - type: Authentication
        url: https://developer.lufthansa-cargo.com/how-to-connect
  - aid: lufthansa-cargo:lufthansa-cargo-shipment-tracking-subscribe-api
    name: Lufthansa Cargo Shipment Tracking Subscribe API
    description: >-
      Subscription API that pushes shipment milestone updates to a caller-supplied
      HTTPS callback URL. Create, read, update, delete and list subscriptions for a
      given Air Waybill and status filter; the OpenAPI declares a
      shipmentStatusUpdate callback against the request-body callback field, with
      401 for a disabled callback host and 403 for a callback host not allowed.
      Status filter values are the IATA cargo status codes RCS, MAN, DEP, ARR, RCF,
      NFD, DLV, DDL, RCT, TFD, DIS, TOA and PRE. OpenAPI 3.0.0, version
      "1.0 - 2022.01.03".
    humanURL: https://developer.lufthansa-cargo.com/apis/shipmenttrackingsubscribepublic
    baseURL: https://api.lufthansa-cargo.com
    tags:
      - Webhooks
      - Track and Trace
      - Air Cargo
      - Events
      - Air Waybill
    properties:
      - type: OpenAPI
        url: openapi/lufthansa-cargo-shipment-tracking-subscribe-api-openapi.yml
      - type: Documentation
        url: https://developer.lufthansa-cargo.com/apis/shipmenttrackingsubscribepublic
      - type: Authentication
        url: https://developer.lufthansa-cargo.com/how-to-connect
  - aid: lufthansa-cargo:lufthansa-cargo-routing-offer-api
    name: Lufthansa Cargo Routing Offer API
    description: >-
      Returns possible direct and connecting route offers between an origin and a
      destination 3-letter IATA airport code for a given departure date and
      Lufthansa Cargo product code, based on Latest Acceptance Time. Product codes
      are the carrier's own enumeration (FAN, FCO, FCP, FDG, FTF, FUN, FWN, YCO,
      YCP, YDG, YNB, YNZ, YTF, YUN, ZXB, ZXF, ZXO), with a filter for freighter and
      truck connections only. OpenAPI 3.0.0, version "1.1 - 2022.04.27".
    humanURL: https://developer.lufthansa-cargo.com/apis/routingpublic
    baseURL: https://api.lufthansa-cargo.com
    tags:
      - Routing
      - Schedules
      - Air Cargo
      - Capacity
    properties:
      - type: OpenAPI
        url: openapi/lufthansa-cargo-routing-offer-api-openapi.yml
      - type: Documentation
        url: https://developer.lufthansa-cargo.com/apis/routingpublic
      - type: Authentication
        url: https://developer.lufthansa-cargo.com/how-to-connect
  - aid: lufthansa-cargo:lufthansa-cargo-station-information-api
    name: Lufthansa Cargo Station Information API
    description: >-
      Reference data for Lufthansa Cargo stations worldwide, keyed on 3-letter IATA
      station codes. Lists all station codes, returns detail for a single station,
      and accepts a POST batch of codes. Detail covers addresses, contacts, ground
      handling agents, daily opening hours, and export and import operational
      capability including dangerous-goods classes, temperature-controlled and
      frozen storage ranges, dry ice, tarmac protection and container types.
      OpenAPI 3.0.0, version 2.0.
    humanURL: https://developer.lufthansa-cargo.com/apis/stationinformationpublic
    baseURL: https://api.lufthansa-cargo.com
    tags:
