- aid: lufthansa-cargo:lufthansa-cargo-shipment-tracking-subscribe-api
  name: Lufthansa Cargo Shipment Tracking Subscribe API
  description: >-
    Subscription API that pushes shipment milestone updates to a caller-supplied HTTPS callback URL. Create,
    read, update, delete and list subscriptions for a given Air Waybill and status filter; the OpenAPI
    declares a shipmentStatusUpdate callback against the request-body callback field, with 401 for a disabled
    callback host and 403 for a callback host not allowed. Status filter values are the IATA cargo status
    codes RCS, MAN, DEP, ARR, RCF, NFD, DLV, DDL, RCT, TFD, DIS, TOA and PRE. OpenAPI 3.0.0, version "1.0
    - 2022.01.03".
  humanURL: https://developer.lufthansa-cargo.com/apis/shipmenttrackingsubscribepublic
  baseURL: https://api.lufthansa-cargo.com
