name: Lufthansa Cargo
kind: company
description: >-
  Lufthansa Cargo AG is the air freight arm of the Lufthansa Group, headquartered
  in Frankfurt, Germany. It sells and operates belly capacity across the Lufthansa
  passenger fleet plus its own Boeing 777F freighters, and runs the Frankfurt
  Cargo Center hub, so it sits in the chain as the airline carrier between the
  freight forwarder and the destination handling agent. Its API posture is real
  but two-speed: a live Apigee developer portal at developer.lufthansa-cargo.com
  publishes four OpenAPI 3.0 contracts anonymously downloadable without a login
  (Routing Offer, Shipment Tracking, Shipment Tracking Subscribe, Station
  Information), while six further API products in the same portfolio - smartBooking,
  Truck PreAdvice, ULD Status, AirMail, CargoXML and CargoIMP - are published only
  as info-block stubs carrying the sentence that access is granted upon prior
  approval and agreement. Registration is reviewed by Lufthansa Cargo API managers
  before keys are issued and production access requires successful test-environment
  validation, so this is application-approval, not self-serve. The published REST
  surface is a proprietary Lufthansa Cargo shape, but it carries open air-cargo
  vocabulary inside it - IATA AWB prefix 020 plus 8-digit AWB numbers, 3-letter
  IATA station codes and the IATA cargo status code set (RCS, MAN, DEP, ARR, RCF,
  NFD, DLV) - while the legacy Cargo-IMP and Cargo-XML EDI message sets remain in
  the portfolio as gated products and IATA ONE Record went live in July 2026
  through the IBS Software ONE Record server rather than as anything Lufthansa
  Cargo publishes itself.
