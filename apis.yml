- aid: lufthansa-cargo:lufthansa-cargo-uld-status-api
  name: Lufthansa Cargo ULDStatus API
  description: >-
    Prior-agreement API behind the smartULD add-on service. Exposes sensory data from smart Unit Load
    Devices - ambient temperature, battery level, geodata - plus container check status from handling
    for both smart and regular ULDs, aimed at Active Temp Control shipments. Documented services are get
    container data, create container subscriptions, list subscriptions, get a single subscription and
    delete a subscription. The portal publishes only an OpenAPI info block; no paths or schemas were published
    to harvest.
