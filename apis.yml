  - aid: lufthansa-cargo:lufthansa-cargo-uld-status-api
    name: Lufthansa Cargo ULDStatus API
    description: >-
      Prior-agreement API behind the smartULD add-on service. Exposes sensory data
      from smart Unit Load Devices - ambient temperature, battery level, geodata -
