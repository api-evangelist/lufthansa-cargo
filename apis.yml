- aid: lufthansa-cargo:lufthansa-cargo-smartbooking-api
  name: Lufthansa Cargo smartBooking API
  description: >-
    Prior-agreement API. Lufthansa Cargo's digital booking connect for forwarders wiring an in-house system
    to the carrier and for ePlatforms integrating LH Cargo offers and bookings. Documented services are
    Product Offer Request, Booking, Update Booking, Get Booking, Delete Booking, and proactive status
    updates on existing bookings via Booking Push. The portal publishes only an OpenAPI info block for
    this product carrying the sentence that access is granted upon prior approval and agreement; no paths,
    servers or schemas are published, so no machine-readable contract was harvested.
  humanURL: https://developer.lufthansa-cargo.com/prior-agreement-apis
