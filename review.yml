aid: lufthansa-cargo
name: Lufthansa Cargo
review:
  question: >-
    Does Lufthansa Cargo publish a callable, standards-conformant API surface that
    the next party in the air cargo chain - a forwarder, an ePlatform, a handling
    agent, a postal operator - can integrate against, and on what terms?
  answer: partial
  date: '2026-07-30'
  reviewer: API Evangelist
  tier: air-cargo-carrier
  cohort: air-cargo-parcel
  homeCountry: Germany
domain:
  hinted: lufthansa-cargo.com
  confirmed: lufthansa-cargo.com
  note: >-
    Hint confirmed as the real primary domain. https://lufthansa-cargo.com and
    https://www.lufthansa-cargo.com both returned HTTP 403 to scripted requests -
    a Cloudflare interstitial ("Just a moment... Enable JavaScript and cookies to
    continue"), not a dead host. The developer subdomain on the same apex is
    unprotected and returned HTTP 200, which is where all evidence below comes
    from. The corporate entity is Lufthansa Cargo AG, Frankfurt, Germany, an
    airline subsidiary of Deutsche Lufthansa AG.
findings:
  summary: |
    Lufthansa Cargo runs a real, live, publicly reachable developer portal at
    developer.lufthansa-cargo.com (Apigee integrated portal, site id
    lhg-lcagapi-gnw-p-lufthansacargodeveloperportalprod). It lists ten published
    API products. Four of those ten carry a genuine OpenAPI 3.0 document that is
    anonymously downloadable with no login and no key - Shipment Tracking, Shipment
    Tracking Subscribe, Routing Offer and Station Information - and all four were
    harvested verbatim into openapi/ and parse.

    The other six - smartBooking, TruckPreAdvice, ULDStatus, AirMail, CargoXML and
    CargoIMP - are published as OpenAPI info blocks only. Each is a valid YAML
    fragment with an `openapi` version and an `info` object and nothing else: no
    servers, no paths, no components. The description field of each is, in whole or
    in part, the sentence "Please be aware that Lufthansa Cargo will only give
    access to the API upon prior approval and agreement. Please contact LH Cargo in
    case of interest." Because they declare no operations they are not valid
    OpenAPI documents and were deliberately not saved into openapi/; they are
    recorded here in full instead.

    That split is the finding. The read-only surface (tracking, routing, station
    reference data) is open enough to design against before you sign anything. The
    transacting surface (booking, ULD telematics, truck pre-advice, airmail) and
    the entire EDI surface (Cargo-XML, Cargo-IMP) are behind a bilateral agreement
    with nothing machine-readable published at all.
  portal:
    url: https://developer.lufthansa-cargo.com/
    httpStatus: 200
    confirmed: true
    platform: Google Apigee integrated developer portal (Angular SPA)
    siteId: lhg-lcagapi-gnw-p-lufthansacargodeveloperportalprod
    anonymousSpecDownload: true
    note: >-
      The portal's own JSON API confirms anonymous access - every apiDoc record
      returns "anonAllowed": true, and download_spec served the full OpenAPI to an
      unauthenticated request. The onboarding page states plainly that the
      production portal allows users to "Download API specifications
      (self-service)".
  probes:
    - url: https://lufthansa-cargo.com
      status: 403
      note: Redirects to www; Cloudflare JS interstitial blocks scripted fetch.
    - url: https://www.lufthansa-cargo.com/
      status: 403
      note: Same interstitial. Corporate site is human-browsable, not machine-readable.
    - url: https://www.lufthansa-cargo.com/en/onerecord
      status: 403
      note: ONE Record marketing page exists per search indexing but is Cloudflare-gated.
    - url: https://developer.lufthansa-cargo.com/
      status: 200
      note: Live developer portal, no login required to reach.
    - url: https://developer.lufthansa-cargo.com/siteid
      status: 200
      note: Returns the Apigee portal site id used to reach the portal JSON API.
    - url: https://developer.lufthansa-cargo.com/portals/api/sites/lhg-lcagapi-gnw-p-lufthansacargodeveloperportalprod/liveportal/apis
      status: 200
      note: Public API catalog. Returned 10 published apiDocs, all anonAllowed true.
    - url: https://developers.lufthansa-cargo.com
      status: 000
      note: Does not resolve.
    - url: https://docs.lufthansa-cargo.com
      status: 000
      note: Does not resolve.
    - url: https://api.lufthansa-cargo.com
      status: 404
      note: Gateway host is live but the root path 404s; it is not a portal.
    - url: https://api.lufthansa-cargo.com/openapi.json
      status: 404
    - url: https://api.lufthansa-cargo.com/swagger.json
      status: 404
    - url: https://api.lufthansa-cargo.com/.well-known/
      status: 404
    - url: https://api.lufthansa-cargo.com/.well-known/one-record
      status: 404
      note: >-
        Probed specifically for a ONE Record discovery document. Not present -
        Lufthansa Cargo publishes no ONE Record endpoint of its own.
    - url: https://api.lufthansa-cargo.com/lhcargo/handling/shipmenttracking/v4/shipment
      status: 401
      note: >-
        Confirms the gateway is live and the documented base path is real; rejects
        an unkeyed call as expected.
    - url: https://developer.lufthansa-cargo.com/openapi.json
      status: 200
      note: >-
        FALSE POSITIVE - the Angular SPA returns its index.html for any unmatched
        path. Body is HTML, not JSON. Treated as absent.
    - url: https://developer.lufthansa-cargo.com/.well-known/security.txt
      status: 200
      note: >-
        FALSE POSITIVE - same SPA index.html fallback. No security.txt is published.
    - url: https://developer-test.lufthansa-cargo.com
      status: 200
      note: >-
        Separate test portal, site id lhg-lcagapi-73b93p-n-lufthansacargodeveloperportal.
        Its public API catalog returns zero apiDocs; the onboarding page confirms
        the test environment is "controlled" - users may register only, and cannot
        create applications or request APIs themselves.
    - url: https://github.com/LufthansaCargo
      status: 200
      note: >-
        Real GitHub organization (id 67584811, created 2020-06-29, website
        www.lufthansa-cargo.com) with ZERO public repositories. No SDKs, no specs,
        no samples published there.
    - url: https://github.com/lufthansa-cargo
      status: 200
      note: GitHub HTML soft-200; the API confirms no such org exists (404).
    - url: https://api.developer.iata.org/lufthansa-cargo/api/shipment-tracking
      status: 000
      note: >-
        Surfaced in search as an IATA-hosted listing of the LH Cargo Shipment
        Tracking API; host did not resolve on probe, so not treated as evidence.
