actions:
  openapiHarvested: 4
  apiProductsListed: 10
  apisYmlCreated: true
  githubRepoCreated: false
  pushed: false
  followUps:
    - >-
      Re-probe after the gateway migration completes; the published specs predate
      the announced endpoint change and may be stale.
    - >-
      Watch for a Lufthansa Cargo ONE Record endpoint or well-known document. Today
      the standard is reachable only through IBS Software's server, which means the
      carrier's ONE Record conformance is not independently verifiable.
    - >-
      smartBooking is the commercially interesting surface for the aggregator layer
      and is the one with no published contract; worth re-checking whether a spec
      is ever promoted out of prior-agreement status.
