interoperability:
  standardConformance:
    verdict: >-
      Partial and indirect. Lufthansa Cargo implements IATA ONE Record in
      production as of July 2026, but through a third party's server and not on
      any surface it publishes; the standards it publishes as its own API products
      (Cargo-XML, Cargo-IMP) are gated stubs with no version, message set or
      schema disclosed. The four contracts it does publish are proprietary REST
      shapes that reuse open IATA vocabulary internally.
    standards:
      - standard: IATA ONE Record
        version: >-
          Not stated. Coverage says IATA "introduced ONE Record in January 2026";
          no version, release or profile is named by Lufthansa Cargo.
        status: implemented-in-production-but-not-published
        evidence: https://www.mynewsdesk.com/lufthansa-cargo-ag/pressreleases/lufthansa-cargo-wisetech-global-and-ibs-software-shape-the-future-of-air-cargo-with-one-record-3458252
        note: >-
          Lufthansa Cargo, WiseTech Global and IBS Software announced a live ONE
          Record data exchange on 14 July 2026. Master Air Waybill records were
          executed by a forwarder in WiseTech's CargoWise and "successfully
          received and processed in Lufthansa Cargo's system via the IBS ONE
          Record server". The integration is therefore mediated by IBS Software's
          ONE Record server, not by a Lufthansa Cargo endpoint. Nothing on
          developer.lufthansa-cargo.com references ONE Record, no ONE Record API
          product is listed among the ten, and
          api.lufthansa-cargo.com/.well-known/one-record returned 404. This is
          exactly the travel-quartet pattern repeating downstream: the standard is
          adopted operationally while the carrier's own published surface stays
          proprietary.
      - standard: IATA Cargo-XML
        version: not published
        status: gated-product-no-contract
        evidence: https://developer.lufthansa-cargo.com/apis/cargoxml
        note: >-
          Listed as a published API product ("CargoXML API") whose OpenAPI 3.0.3
          document contains only info.title "CargoXML APIs" and the prior-approval
          notice. No message types, no edition, no endpoint.
      - standard: IATA Cargo-IMP
        version: not published
        status: gated-product-no-contract
        evidence: https://developer.lufthansa-cargo.com/apis/cargoimp
        note: >-
          Listed as "CargoIMP API", OpenAPI 3.0.1 info block titled
          "CargoMessaging APIs", description is the prior-approval notice only.
          IATA froze Cargo-IMP at the 34th edition in 2014; no edition is stated.
      - standard: IATA cargo status / movement codes
        version: not versioned
        status: vocabulary-reused-inside-proprietary-contract
        evidence: openapi/lufthansa-cargo-shipment-tracking-subscribe-api-openapi.yml
        note: >-
          The subscribe API's shipmentStatus filter enumerates the standard IATA
          cargo status codes RCS, MAN, DEP, ARR, RCF, NFD, DLV, DDL, RCT, TFD,
          DIS, TOA, PRE. This is the one genuinely shared vocabulary in the
          published surface - a forwarder already speaking FSU/FWB status codes
          can map it without a glossary, even though the envelope is proprietary.
      - standard: IATA location codes
        version: n/a
        status: identifier-standard-reused
        evidence: openapi/lufthansa-cargo-routing-offer-api-openapi.yml
        note: >-
          3-letter IATA airport/station codes are the routing and station-reference
          keys throughout.
      - standard: DCSA
        status: not-applicable
        note: Air cargo carrier, not an ocean container line. DCSA is out of scope.
      - standard: GS1 (EPCIS, GTIN/SSCC/GLN)
        status: no-reference-found
        note: No GS1 identifier or EPCIS event vocabulary appears anywhere in the four harvested specs or on the portal.
      - standard: UN/EDIFACT, ANSI X12
        status: no-direct-reference-found
        note: >-
          Neither is named on the portal. Cargo-IMP is itself EDIFACT-derived, but
          Lufthansa Cargo never names EDIFACT.
      - standard: UN/CEFACT MMT RDM, WCO Data Model, eFTI, MLETR
        status: no-reference-found
      - standard: e-freight / eAWB
        status: referenced-only-as-a-response-field
        evidence: openapi/lufthansa-cargo-shipment-tracking-api-openapi.yml
        note: >-
          The Shipment Tracking response carries an `efreightDetails` object, so
          e-freight status is exposed, but no e-freight or eAWB standard, version
          or IATA Resolution is cited.
  interfaceShape: standard-plus-proprietary
  interfaceShapeNote: >-
    Graded standard-plus-proprietary, and only just. The four published contracts
    are unambiguously Lufthansa-Cargo-specific in structure - paths like
    /lhcargo/handling/shipmenttracking/v4/shipment, a carrier-private product-code
    enumeration (FAN, FCO, FCP, YCP, ZXF...), a milestonePlan/milestone response
    model that no other carrier implements, and an `apikey` header scheme. Nobody
    else implements this shape, so a forwarder integrating Lufthansa Cargo does an
    N-of-1 integration. What lifts it above plain proprietary-documented is that
    the payload keys are open industry identifiers (AWB prefix + number, IATA
    station codes) and the event filter is the open IATA status code set, so the
    data inside the proprietary envelope is portable even when the envelope is not.
    The genuinely open-standard path - ONE Record - exists in production but is not
    part of the published interface.
  identifierScheme: >-
    IATA Air Waybill numbers as the primary shipment key - a 3-digit airline
    numeric prefix (020 = Lufthansa Cargo, validated ^\d{3}$) plus an 8-digit AWB
    serial (^\d{8}$), also expressed as "020-12345678" in the subscribe API, with a
    check-digit flag, AWB sequence number, revision number and AWB issue station;
    3-letter IATA airport/station codes for origin, destination, station reference
    and milestone location; carrier-private Lufthansa Cargo product codes for
    service class; an optional 9-digit Business Partner Number identifying the
    contracted counterparty on subscriptions; and UUIDv4 opaque subscription IDs.
    No GS1 GTIN/SSCC/GLN, no UN/LOCODE, no EORI, no HS code, no SCAC, no DUNS
    appears anywhere in the harvested contracts.
  eventModel: webhook-and-polling
  eventModelNote: >-
    Both patterns are published and both are real. Polling: GET
    /lhcargo/handling/shipmenttracking/v4/shipment returns current status plus the
    full shipmentStatusEvents history for an AWB. Push: POST
    /lhcargo/handling/shipmenttrackingpush/v4/subscribe creates a subscription
    against a caller-supplied HTTPS callback URI and the OpenAPI declares a formal
    `callbacks.shipmentStatusUpdate` block keyed on {$request.body#/callback},
    requiring the callback host to answer OPTIONS with an Allow header including
    POST, then receiving ShipmentStatusUpdate payloads by POST. Subscriptions are
    filtered by IATA status code and managed with full CRUD (GET all by callback,
    GET/PUT/DELETE by subscriptionId). Notably the carrier maintains an allow-list
    of callback hosts - the spec documents 401 "Callback host disabled" and 403
    "Callback host not allowed" - so even the push path is not unilaterally
    self-serve. ULDStatus advertises the same subscribe pattern for smart-ULD
    telematics and smartBooking advertises a "Booking Push", but both are
    prior-agreement products with no contract published. No AsyncAPI document is
    published.
  ediLegacy: >-
    EDI is still a first-class integration path and is treated as a gated product,
    not a public one. The portfolio explicitly ships CargoXML and CargoIMP
    ("CargoMessaging") API products, and the how-to-connect page states the
    offering is "a collection of RESTful and SOAP web services" - the SOAP half
    being the legacy channel. No message set, edition, VAN, AS2 or mapping
    requirement is documented publicly; onboarding for these is contact-only via
    apisupport.lcag@dlh.de. Lufthansa Cargo's own ONE Record positioning is that
    Cargo-IMP and Cargo-XML no longer meet modern data-exchange requirements, so
    the direction of travel is off EDI - but as of this review the REST veneer
    covers only tracking, routing and station data, while messaging remains
    bilateral.
  multiPartyPosture: >-
    Publishes to its counterparties, but only after a bilateral relationship
    exists. The portal is explicitly addressed to "partners, developers and API
    users", and smartBooking is documented as being directed at forwarders
    connecting an in-house system and at ePlatforms integrating LH Cargo offers -
    so the carrier does intend to be resold through aggregators, not only called
    directly. Anyone at all can read the four public contracts anonymously. But
    every account registration on both the test and production portals "is reviewed
    by LH Cargo API Managers before access is granted", the test environment is
    controlled to the point that only Lufthansa Cargo staff can create applications
    and grant API access on a user's behalf, production access is granted only
    after successful test validation, and callback hosts for push must be
    allow-listed. There is no public partner or marketplace directory of pre-built
    integrations on the portal; named integrations (WiseTech CargoWise, IBS
    Software, Fleet Logistics) surface only through press releases. Subscriptions
    optionally carry a Business Partner Number, which is a contracted-party key.
  accessGate: application-approval
  accessGateNote: >-
    What a developer must actually do, in Lufthansa Cargo's own published order:
    (1) register an account on the production portal at
    developer.lufthansa-cargo.com and accept the Terms and Conditions, which
    incorporate both the General Terms and Conditions and a per-API "Specification
    of Services Agreement"; (2) wait - registration is reviewed by LH Cargo API
    managers before access is granted; (3) create an app and request the API
    products of interest, receiving an API key and secret used as an `APIKEY`
    request header against https://api.lufthansa-cargo.com; (4) have the LH Cargo
    API support team provision test-environment access and keys on your behalf,
    since the test portal does not permit self-service app creation; (5) pass test
    validation before production access is granted. Quotas are deliberately small
    at first - "a limited number of requests... enough to explore the API" - and
    raising them requires contacting the carrier. For smartBooking, TruckPreAdvice,
    ULDStatus, AirMail, CargoXML and CargoIMP add a prior bilateral agreement
    negotiated by email before anything at all is issued. Spec download is the one
    genuinely self-serve step, and only for the four public products.
  dcsaMembershipVsPublication:
    applicable: false
    note: >-
      DCSA is ocean-container-specific. The air-cargo equivalent asked of this
      cohort is ONE Record and Cargo-XML, recorded above: Lufthansa Cargo is a
      visible, publicly-announced ONE Record implementer (July 2026, with WiseTech
      and IBS Software) that publishes zero ONE Record artifacts of its own, and
      lists Cargo-XML and Cargo-IMP as products with no contract behind either.
      Membership and marketing are public; the conformant callable contract is not.
