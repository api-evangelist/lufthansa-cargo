  staleness:
    note: >-
      Three of the four published contracts carry 2022 info.version strings and the
      fourth is unversioned "2.0". The portal news item dated 1 April 2026
      announces a new API gateway with customer migration to new endpoints
      "until end of May 2026", so the published documents may lag the live gateway.
      Recorded as observed; not corrected.
authentication:
  type: apiKey
  in: header
  headerName: apikey
  note: >-
    Both spellings appear in the published artifacts - `ApikeyAuth` with header
    name `apikey` in three specs, `ApiKeyAuth` in the Station Information spec, and
    the how-to-connect page shows `APIKEY: {yourApiKey}`. HTTP headers are
    case-insensitive so this is cosmetic, but it is an inconsistency across the
    carrier's own contracts. No OAuth, no mTLS and no scopes are published.
