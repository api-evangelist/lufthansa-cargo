    /portals/api/sites/{siteId}/liveportal/apis for the catalog and
    /portals/api/sites/{siteId}/liveportal/apis/{apiId}/download_spec for each
    contract. All calls were unauthenticated.
  fetchDate: '2026-07-30'
  specs:
    - file: openapi/lufthansa-cargo-shipment-tracking-api-openapi.yml
      sourceURL: https://developer.lufthansa-cargo.com/portals/api/sites/lhg-lcagapi-gnw-p-lufthansacargodeveloperportalprod/liveportal/apis/shipmenttrackingpublic/download_spec
      httpStatus: 200
      bytes: 8263
      openapi: 3.0.0
      infoVersion: '1.0 - 2022.01.03'
      parses: true
      verbatim: true
